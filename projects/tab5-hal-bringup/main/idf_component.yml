## IDF Component Manager Manifest
## The m5stack_tab5 BSP provides the board-level display/touch/IO definitions
## for the M5Stack Tab5 (ESP32-P4 + ESP32-C6).  It requires network access to
## resolve from the Espressif Component Registry on first build.
dependencies:
  espressif/m5stack_tab5:
    version: "^1.3.2"
    public: true
  espressif/usb_host_hid:
    version: "^1.0.4"
